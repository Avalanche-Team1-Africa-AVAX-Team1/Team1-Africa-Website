[build]
  command = "npm run build"
  publish = "dist"

# Vite fingerprints everything under /assets/, so those URLs are safe to
# cache forever. A new build produces new filenames.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always be revalidated, otherwise clients keep loading
# stale asset URLs after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
